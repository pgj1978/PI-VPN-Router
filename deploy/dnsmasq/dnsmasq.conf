# Base dnsmasq config. Everything specific to this router — the interface, DHCP range,
# upstream resolvers and static reservations — is written by the API into /etc/dnsmasq.d.

conf-dir=/etc/dnsmasq.d,*.conf

# Leases live on a volume shared with the API, which reads this file to resolve a device's
# MAC to the address it currently holds.
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Never inherit the host's /etc/resolv.conf. A resolver going unreachable in that file is
# what took this router's tunnel down once already, and it silently broke DNS for every LAN
# client at the same time. Upstreams are set explicitly in 10-pirouter.conf instead.
no-resolv

log-dhcp
