# PiRouter stack.
#
# All three services run on the host network. That is not laziness: the API has to
# manipulate the host's netfilter and WireGuard state, dnsmasq has to serve DHCP on a real
# LAN interface, and nginx has to reach the API on loopback. Everything that would otherwise
# be hardcoded comes from .env.

name: pirouter

services:
  api:
    build:
      context: ../src
      dockerfile: PiRouter.Api/Dockerfile
    image: pirouter-api:latest
    container_name: pirouter-api
    restart: unless-stopped

    network_mode: host
    # Needed to write iptables rules and bring WireGuard interfaces up on the host.
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_PTRACE
    # pid:host lets the API find and SIGHUP dnsmasq wherever it is running, and lets
    # nsenter reach init for the reboot endpoint.
    pid: host
    privileged: true

    volumes:
      - /etc/wireguard:/etc/wireguard
      - /var/lib/misc:/var/lib/misc:ro
      - ./config:/app/config
      - ./vpn_profiles:/app/config/vpn_profiles
      - ./dnsmasq.d:/etc/dnsmasq.d
      # Used only to restart the dnsmasq container when the DHCP range changes.
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ROUTER_LanInterface: ${LAN_INTERFACE}
      ROUTER_WanInterface: ${WAN_INTERFACE}
      ROUTER_VpnInterface: ${VPN_INTERFACE}
      ROUTER_LanAddress: ${LAN_ADDRESS}
      ROUTER_DhcpRangeStart: ${DHCP_RANGE_START}
      ROUTER_DhcpRangeEnd: ${DHCP_RANGE_END}
      ROUTER_DhcpLeaseTime: ${DHCP_LEASE_TIME}
      ROUTER_ApiPort: ${API_PORT}
      ROUTER_ApplyRules: ${APPLY_RULES}
      ROUTER_ReconcileIntervalSeconds: ${RECONCILE_INTERVAL}
      ROUTER_ConfigFilePath: /app/config/router_config.json
      ROUTER_VpnProfilesDirectory: /app/config/vpn_profiles
      ROUTER_DnsmasqConfigDirectory: /etc/dnsmasq.d
      ROUTER_DnsmasqLeaseFile: /var/lib/misc/dnsmasq.leases

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${API_PORT}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  dnsmasq:
    image: pirouter-dnsmasq:latest
    build:
      context: ./dnsmasq
    container_name: pirouter-dnsmasq
    restart: unless-stopped

    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW

    volumes:
      # The API writes 10-pirouter.conf and the static-leases directory here.
      - ./dnsmasq.d:/etc/dnsmasq.d
      # Shared with the API, which reads leases to map a MAC to its current address.
      - /var/lib/misc:/var/lib/misc

    depends_on:
      - api

  ui:
    build:
      context: ../ui
    image: pirouter-ui:latest
    container_name: pirouter-ui
    restart: unless-stopped

    # Host networking so nginx can proxy to the API on loopback. The template binds the
    # listener to the LAN address specifically, so this does not expose the UI on the WAN.
    network_mode: host

    environment:
      LAN_IP: ${LAN_IP}
      UI_PORT: ${UI_PORT}
      API_PORT: ${API_PORT}

    depends_on:
      - api
